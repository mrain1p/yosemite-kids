# Yosemite Kids hub — an always-on peer for the family config.
#
# Paths below are Synology's layout. On another NAS,
# change the left-hand side of the volume line and nothing else.
#
# Normally the NAS pulls a finished image and never compiles anything:
#
#   cd /volume2/Docker/yosemite-kids
#   docker compose -f hub/docker-compose.yml pull
#   docker compose -f hub/docker-compose.yml up -d
#
# CI builds that image on every push touching hub/ or core/ (see
# .github/workflows/hub-image.yml). One-time setup on the NAS, because a
# private repo produces a private package: see docs/HUB.md.
#
# Building on the NAS still works and needs no login — keep it for hacking on
# the hub from the NAS itself, or if GHCR is unreachable:
#
#   docker compose -f hub/docker-compose.yml up -d --build
#
# That path compiles Kotlin on the NAS: 10-20 minutes the first time, printing
# almost nothing while Gradle downloads its distribution and then the compiler.
# It is not stuck; `docker stats` will show it burning CPU. Later builds are
# cached and take seconds.
#
# Then open http://<nas-ip>:8765/health to confirm it is alive, and approve a
# device's enrolment code to pair the first one.

services:
  yosemite-kids-hub:
    # Both keys on purpose, and they do different jobs: `pull` fetches this
    # image, while `up --build` ignores the registry and builds locally,
    # tagging the result with the same name. One file, both workflows, and no
    # second compose file to drift.
    image: ghcr.io/mrain1p/yosemite-kids-hub:latest
    build:
      # Built from the repo root: the image needs :core as well as :hub, and a
      # context of ./hub could not see it.
      context: ..
      dockerfile: hub/Dockerfile
    container_name: yosemite-kids-hub
    restart: unless-stopped

    # One published port, not host networking.
    #
    # The hub is a plain server: devices dial it by IP and it never broadcasts,
    # discovers, or listens on anything else. Host mode therefore bought it
    # nothing and cost the isolation — a container in host mode sees every
    # interface and every other service on the NAS.
    #
    # Both sides read the same variable on purpose. Publishing one port while
    # the process listens on another gives you a container that is healthy,
    # running, and unreachable, which is a genuinely nasty half hour: the
    # health check passes because it runs inside the container.
    #
    # To move it, set YOSEMITE_KIDS_PORT in a .env file beside this one, or export
    # it before running compose. Then use the new port when you connect a
    # phone, because the app defaults to 8765.
    ports:
      - "${YOSEMITE_KIDS_PORT:-8765}:${YOSEMITE_KIDS_PORT:-8765}"

    volumes:
      # config.json and devices.json. Deliberately a subfolder, not the folder
      # holding the source: the data is the family's whole setup and wants
      # backing up, while the source is disposable and gets replaced on every
      # update.
      - /volume2/Docker/yosemite-kids/data:/data

    environment:
      - YOSEMITE_KIDS_DATA=/data
      # The same variable the ports line above uses, so the two cannot drift.
      - YOSEMITE_KIDS_PORT=${YOSEMITE_KIDS_PORT:-8765}
      # Only affects log timestamps; the merge itself never reads a clock.
      - TZ=America/New_York
      # A config file and a few dozen devices. Left to itself the JVM sizes its
      # heap from the NAS's total RAM and reserves far more than this will use.
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=50

    mem_limit: 256m
