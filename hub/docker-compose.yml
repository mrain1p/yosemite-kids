# Yosemite Kids hub — an always-on peer for the family config.
#
# Pull only. CI builds the image on every push that touches the hub
# (.github/workflows/hub-image.yml) and publishes it to GHCR, so the NAS
# never compiles anything:
#
#   docker compose -f docker-compose.yml pull
#   docker compose -f docker-compose.yml up -d
#
# or paste this file into a Synology Container Manager project and press
# Build, then Run. The package must be public, or the NAS logged in to GHCR
# once — see docs/HUB.md, "Deploying".
#
# Building on the NAS is still possible for hacking on the hub from the box
# itself, but it is a plain `docker build` from the repo root, not a compose
# key: the data folder below belongs to the container's user, and the NAS's
# older builder stops at "can't stat data" while scanning the context unless
# the build runs as root. Two commands, in the unpacked source tree:
#
#   sudo docker build -f hub/Dockerfile -t ghcr.io/mrain1p/yosemite-kids-hub:latest .
#   docker compose -f hub/docker-compose.yml up -d
#
# Paths below are Synology's layout. On another NAS, change the left-hand
# side of the volume line and nothing else.

services:
  yosemite-kids-hub:
    image: ghcr.io/mrain1p/yosemite-kids-hub:latest
    container_name: yosemite-kids-hub
    restart: unless-stopped

    # Two published ports, not host networking.
    #
    # The hub is a plain server: devices dial it by IP and it never broadcasts,
    # discovers, or listens on anything else. Host mode therefore bought it
    # nothing and cost the isolation — a container in host mode sees every
    # interface and every other service on the NAS.
    #
    # Both sides of each line read the same variable on purpose. Publishing one
    # port while the process listens on another gives you a container that is
    # healthy, running, and unreachable, which is a genuinely nasty half hour:
    # the health check passes because it runs inside the container.
    #
    # 8765 is the parents' console and every device's sync. 8766 is where a
    # child's browser watches, and it is a SECOND ORIGIN rather than a path on
    # the first — that is a security boundary, not a layout choice. On one
    # origin a page a child opens can POST to /api/config with a parent's
    # session cookie riding along, and every check the hub makes agrees that it
    # may: same host, same site, and HttpOnly does not stop a page sending a
    # cookie it never reads. Two ports make the browser refuse it for us.
    #
    # To move either, set YOSEMITE_KIDS_PORT or YOSEMITE_KIDS_KID_PORT in a
    # .env file beside this one, or export them before running compose. Then
    # use the new port when you connect a phone, because the app defaults to
    # 8765.
    ports:
      - "${YOSEMITE_KIDS_PORT:-8765}:${YOSEMITE_KIDS_PORT:-8765}"
      - "${YOSEMITE_KIDS_KID_PORT:-8766}:${YOSEMITE_KIDS_KID_PORT:-8766}"

    volumes:
      # config.json and devices.json. Deliberately a subfolder, not the folder
      # holding the source: the data is the family's whole setup and wants
      # backing up, while the source is disposable and gets replaced on every
      # update.
      - /volume2/Docker/yosemite-kids/data:/data

    environment:
      - YOSEMITE_KIDS_DATA=/data
      # The same variables the ports lines above use, so no pair can drift.
      - YOSEMITE_KIDS_PORT=${YOSEMITE_KIDS_PORT:-8765}
      - YOSEMITE_KIDS_KID_PORT=${YOSEMITE_KIDS_KID_PORT:-8766}
      # Only affects log timestamps; the merge itself never reads a clock.
      - TZ=America/New_York
      # A config file and a few dozen devices. Left to itself the JVM sizes its
      # heap from the NAS's total RAM and reserves far more than this will use.
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=50

    # 384m, up from 256m: the crawl holds NewPipe's parsed pages and one
    # source's video list in memory while a batch runs. Measure the first full
    # crawl with `docker stats` and put the number in docs/HUB.md.
    mem_limit: 384m
