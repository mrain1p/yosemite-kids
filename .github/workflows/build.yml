# PR gate: compiles the app and runs the non-network unit tests.
# The live-YouTube smoke tests are deliberately excluded here (they run on a
# schedule in extractor-smoke.yml) so PR checks never fail on throttling.
name: Build

# Skips commits that touch nothing the build can see — site/ is a static copy
# of upstream's website that nothing here builds or publishes, and prose has no
# bearing on whether the app compiles. Everything else, including gradle and
# manifest files, still runs.
on:
  # Only the marketing site is ignored. Markdown used to be ignored too, and
  # it should not be: the gate reads the docs. Guard 8 holds ROADMAP's anchor
  # table to code that exists, guards 14, 30 and 57 hold the route tables in
  # LAN-API to the routes actually registered, and guard 67 regenerates
  # GUARDS.md from the guards themselves. Each of those has failed on a
  # documentation change - and with markdown ignored, the fix for one of them
  # could not be verified here at all, because the fix is itself a .md file.
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
  pull_request:
    paths-ignore:
      - "site/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # First, and before the toolchain: these are pure source inspection, they
      # need no SDK, and they finish in a second. A guard failure should be
      # reported now rather than after a ten-minute Gradle build.
      #
      # Until this step existed the ~29 guards ran only when a human typed the
      # command — and this repo has twice shipped a guard that silently stopped
      # covering anything (check.sh died at line 78 for weeks; a PowerShell
      # guard keyed on a character 5.1 mangles). Enforcing them by memory is
      # what allowed both.
      - name: Source invariants
        run: bash scripts/check.sh --guards

      # Then prove those guards can still fail. The canary breaks the tree one
      # mutation at a time and asserts the gate notices; guard 65 makes a case
      # there mandatory for every guard from 56 upward. It runs here rather
      # than by hand because the bash gate is seconds on Linux and five
      # minutes a run on a Windows checkout, which is why it never had a
      # clean full run before it was wired in.
      - name: Guard canary
        run: bash scripts/guard-canary.sh

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      # :core has no Android on its classpath, which is how the Docker hub will
      # run this exact code. Kept a separate step so a break here reads as
      # "the shared rules broke" rather than as an app failure.
      - name: Core tests (no Android)
        run: ./gradlew :core:test

      - name: Crawl tests (plain JVM, shared with the hub)
        run: ./gradlew :crawl:test

      - name: Hub tests (the container's routes and enrolment)
        run: ./gradlew :hub:test

      # Every test class except the live-YouTube canary, discovered from the
      # tree so a new test file is in the gate without touching this list.
      - name: Unit tests (non-network)
        run: |
          # Recursive, and the package comes from the path: the glob used to
          # be one directory deep with the package pasted on, so a test in a
          # subpackage would have been named wrong and silently not run.
          args=()
          while IFS= read -r f; do
            name=${f##*/}; name=${name%.kt}
            case "$name" in ExtractorSmokeTest|SingleChannelProbeTest) continue ;; esac
            pkg=${f#app/src/test/java/}; pkg=${pkg%/*}
            pkg=$(printf '%s' "$pkg" | tr '/' '.')
            args+=(--tests "$pkg.$name")
          done < <(find app/src/test/java -name '*Test.kt' | sort)
          ./gradlew :app:testDebugUnitTest "${args[@]}"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Worker tests
        run: node --test worker/test/*.test.mjs

      # The two page-level defects that shipped in a fortnight - a strip that
      # never drew, a player that sat at 144p - were both invisible to every
      # guard and every route test, because only a browser runs the page.
      # This signs in as a child does and walks the four screens they use.
      # The hub it drives is SmokeHub: the same HubServer with the election
      # and the crawl left null, so nothing here reaches YouTube.
      - name: Install the browser for the page smoke test
        working-directory: scripts/smoke
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Kid page smoke test
        run: |
          ./gradlew :hub:smokeHub -PsmokePort=18765 > "$RUNNER_TEMP/smoke-hub.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf --max-time 2 http://127.0.0.1:18765/health > /dev/null; then break; fi
            sleep 2
          done
          curl -sf --max-time 5 http://127.0.0.1:18765/health || {
            echo "the smoke hub never answered"; cat "$RUNNER_TEMP/smoke-hub.log"; exit 1;
          }
          node scripts/smoke/smoke.mjs http://127.0.0.1:18765 ada00001 otter sam0000000a

      - name: The smoke hub's log, when the walk failed
        if: failure()
        run: cat "$RUNNER_TEMP/smoke-hub.log" || true

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: "*/build/reports/tests/"
          if-no-files-found: ignore
