# PR gate: compiles the app and runs the non-network unit tests.
# The live-YouTube smoke tests are deliberately excluded here (they run on a
# schedule in extractor-smoke.yml) so PR checks never fail on throttling.
name: Build

# Skips commits that touch nothing the build can see — site/ is a static copy
# of upstream's website that nothing here builds or publishes, and prose has no
# bearing on whether the app compiles. Everything else, including gradle and
# manifest files, still runs.
on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "site/**"
      - "**.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # First, and before the toolchain: these are pure source inspection, they
      # need no SDK, and they finish in a second. A guard failure should be
      # reported now rather than after a ten-minute Gradle build.
      #
      # Until this step existed the ~29 guards ran only when a human typed the
      # command — and this repo has twice shipped a guard that silently stopped
      # covering anything (check.sh died at line 78 for weeks; a PowerShell
      # guard keyed on a character 5.1 mangles). Enforcing them by memory is
      # what allowed both.
      - name: Source invariants
        run: bash scripts/check.sh --guards

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      # :core has no Android on its classpath, which is how the Docker hub will
      # run this exact code. Kept a separate step so a break here reads as
      # "the shared rules broke" rather than as an app failure.
      - name: Core tests (no Android)
        run: ./gradlew :core:test

      - name: Hub tests (the container's routes and enrolment)
        run: ./gradlew :hub:test

      # Every test class except the live-YouTube canary, discovered from the
      # tree so a new test file is in the gate without touching this list.
      - name: Unit tests (non-network)
        run: |
          args=()
          for f in app/src/test/java/io/yosemitekids/app/*Test.kt; do
            name=$(basename "$f" .kt)
            case "$name" in ExtractorSmokeTest|SingleChannelProbeTest) continue ;; esac
            args+=(--tests "io.yosemitekids.app.$name")
          done
          ./gradlew :app:testDebugUnitTest "${args[@]}"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Worker tests
        run: node --test worker/test/*.test.mjs

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
