# PR gate: compiles the app and runs the non-network unit tests.
# The live-YouTube smoke tests are deliberately excluded here (they run on a
# schedule in extractor-smoke.yml) so PR checks never fail on throttling.
name: Build

# Skips commits that touch nothing the build can see — the site under site/ is
# published by deploy-pages.yml, and prose has no bearing on whether the app
# compiles. Everything else, including gradle and manifest files, still runs.
on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - "**.md"
      - ".github/workflows/deploy-pages.yml"
  pull_request:
    paths-ignore:
      - "site/**"
      - "**.md"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      # Every test class except the live-YouTube canary, discovered from the
      # tree so a new test file is in the gate without touching this list.
      - name: Unit tests (non-network)
        run: |
          args=()
          for f in app/src/test/java/io/pickwick/app/*Test.kt; do
            name=$(basename "$f" .kt)
            [ "$name" = "ExtractorSmokeTest" ] && continue
            args+=(--tests "io.pickwick.app.$name")
          done
          ./gradlew :app:testDebugUnitTest "${args[@]}"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Worker tests
        run: node --test worker/test/*.test.mjs

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
